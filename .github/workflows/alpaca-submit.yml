# Places the broker account's auction orders. Two mechanisms:
#
# 1. EVENING QUEUE (the reliable baseline). Alpaca queues market-on-open and
#    market-on-close orders submitted after 19:00 ET for the next session, so
#    the evening runs queue tomorrow's open exits and close entries. GitHub
#    cron has been observed 3-6 hours late; anything between 19:00 ET and
#    08:30 ET works, so several evening/night attempts are scheduled.
# 2. IN-WINDOW REFINEMENT (opportunistic). If a run lands inside 08:45-09:28
#    or 15:10-15:50 ET, it replaces the evening's stale-signal estimate with
#    one from live prices and can add reversal-sleeve entries.
#
# `hf alpaca submit --session auto` picks the action from the wall clock and
# is idempotent; runs outside every window exit quietly. Fills are read and
# recorded by the paper-sessions workflow (`hf trade`) after each session.

name: alpaca-submit

on:
  schedule:
    - cron: "15 23 * * 1-5"   # 19:15 EDT / 18:15 EST(no-op)  evening queue
    - cron: "15 0 * * 2-6"    # 20:15 EDT / 19:15 EST         evening queue
    - cron: "30 2 * * 2-6"    # 22:30 EDT / 21:30 EST         evening queue retry
    - cron: "0 6 * * 1-5"     # 02:00 EDT / 01:00 EST         night retry
    - cron: "0 13 * * 1-5"    # 09:00 EDT (open)          / 08:00 EST no-op
    - cron: "12 13 * * 1-5"   # 09:12 EDT (open retry)    / 08:12 EST no-op
    - cron: "0 14 * * 1-5"    # 09:00 EST (open)          / 10:00 EDT no-op
    - cron: "12 14 * * 1-5"   # 09:12 EST (open retry)    / 10:12 EDT no-op
    - cron: "30 14 * * 1-5"   # 10:30 EDT / 09:30 EST     close entries (early estimate)
    - cron: "0 16 * * 1-5"    # 12:00 EDT / 11:00 EST     close entries
    - cron: "30 17 * * 1-5"   # 13:30 EDT / 12:30 EST     close entries
    - cron: "20 19 * * 1-5"   # 15:20 EDT (close refine)  / 14:20 EST close entries
    - cron: "34 19 * * 1-5"   # 15:34 EDT (close refine)  / 14:34 EST close entries
    - cron: "20 20 * * 1-5"   # 15:20 EST (close refine)  / 16:20 EDT no-op
    - cron: "34 20 * * 1-5"   # 15:34 EST (close refine)  / 16:34 EDT no-op
  workflow_dispatch:

concurrency:
  group: paper-sessions      # shared with paper-sessions.yml so pushes never race
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore market-data cache
        uses: actions/cache@v4
        with:
          path: data_cache/ohlcv_1d.parquet
          key: ohlcv-1d-${{ github.run_id }}
          restore-keys: ohlcv-1d-
      - name: Submit auction orders
        env:
          MPLCONFIGDIR: /tmp/mpl
          TZ: America/New_York
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER || 'true' }}
        run: |
          echo "===== $(date -u +'%Y-%m-%d %H:%M UTC') alpaca-submit run ${{ github.run_id }} =====" >> paper_state/hf/actions.log
          set -o pipefail
          python run.py hf alpaca submit --session auto 2>&1 | tee -a paper_state/hf/actions.log
      - name: Commit pending orders
        if: always()
        run: |
          git config user.name "quantbot"
          git config user.email "quantbot@users.noreply.github.com"
          git add paper_state
          git diff --cached --quiet && echo "no state change" || git commit -m "alpaca: submit $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
